
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Profile — SCP.lol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">SCP<span>.lol</span></a>
    <span class="status">PERSONNEL FILE</span>
  </header>

  <main class="hero">
    <p class="eyebrow">FOUNDATION PERSONNEL DATABASE</p>
    <h1>CREATE YOUR <span>FILE</span></h1>
    <p class="intro">
      Choose your public username and write a short bio.
    </p>

    <form id="profileForm" class="auth-form" hidden>
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        minlength="3"
        maxlength="20"
        pattern="[a-z0-9_]{3,20}"
        autocomplete="username"
        placeholder="e.g. site_researcher"
        required
      >
      <p class="intro">
        Lowercase letters, numbers and underscores only.
      </p>

      <label for="bio">Biography</label>
      <textarea
        id="bio"
        maxlength="160"
        rows="4"
        placeholder="Write a little about yourself..."
      ></textarea>

      <button id="createProfileBtn" type="submit">
        CREATE PERSONNEL FILE
      </button>
    </form>

    <p id="message" class="notice" role="status" aria-live="polite">
      CHECKING PERSONNEL ACCESS...
    </p>

    <p id="accountInfo" class="intro"></p>

    <a href="auth.html">Account access</a>
    <br><br>
    <a href="index.html">← Back to homepage</a>
  </main>

  <script type="module" src="profile-setup.js"></script>
</body>
</html>
